name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # package.json engines is a range (>=18), so pin the version used locally.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # test/download.test.ts and test/ffmpeg.test.ts run real ffmpeg.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
